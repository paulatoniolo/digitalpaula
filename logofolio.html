<!DOCTYPE html>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>logofolio — digitalpaula</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="preload" href="fonts/DigitalPaulaContact.woff2?v=5" as="font" type="font/woff2" crossorigin />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper:#fff; --bg:#000; --ink:#000;
    /* El acento rosa se reemplaza por un degradado lineal gris (#d4d4d4 -> #909090).
       Como un degradado NO puede ir en 'color', el texto lo toma como imagen de fondo
       recortada a la forma de las letras (background-clip:text + text-fill transparente).
       --grad-medio es el tono equivalente para los pocos casos donde no entra un
       degradado: los bordes (necesitarian border-image) y el tinte de fondo que se anima
       con una transicion, que no puede interpolar entre dos imagenes. */
    --grad-ini:#d4d4d4; --grad-fin:#909090; --grad-medio:#b2b2b2;
    --grad:linear-gradient(90deg,var(--grad-ini),var(--grad-fin));
    --disp:"Helvetica Neue",Helvetica,Arial,sans-serif;
    --body:Roboto,"Helvetica Neue",Arial,sans-serif;
    --gmargin:clamp(20px,4vw,64px);
    /* geometria de los paneles de preview. Los nombres derivan su ancho maximo de estos
       dos valores (ver .lfb-name), asi que si se toca el panel el texto se reacomoda solo
       y nunca vuelve a superponerse. */
    --lfb-panel-w:min(29vw,470px);
    --lfb-panel-x:2vw;
    /* tope de alto: una vertical de 460px de ancho y ratio .55 daria 836px de alto y no
       entraria en pantalla. El JS calcula el ancho final como min(ancho, alto*ratio), asi
       respeta la proporcion exacta y ademas nunca se sale. */
    --lfb-panel-hmax:70vh;
    --lfb-zigzag:0vw;
  }
  @font-face{
    font-family:"DigitalPaulaContact";
    src:url('fonts/DigitalPaulaContact.woff2?v=5') format('woff2'),url('fonts/DigitalPaulaContact.otf?v=5') format('opentype');
  }
  @font-face{
    font-family:"HelveticaNeueHeavy";
    src:url("fonts/HelveticaNeueHeavy.otf") format("opentype");
    font-weight:800;
  }
  *{margin:0;padding:0;box-sizing:border-box}

  /* ---------- BARRA DE SCROLL (misma que index.html) ----------
     La del sistema es gris claro y con botones de flecha: sobre negro se lee como un
     elemento ajeno pegado al costado. Van las dos sintaxis: scrollbar-color es el estandar
     pero no permite sacar los botones de las puntas; ::-webkit-scrollbar si. */
  html{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:20px;
    border:3px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.34);
    border:3px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-button{display:none}
  ::-webkit-scrollbar-corner{background:transparent}
  /* min-height y no height: con height:100% el documento quedaba CLAVADO en el alto de la
     pantalla, asi que en mobile -donde la lista ahora mide 1936px- todo lo que pasaba de
     la primera pantalla quedaba cortado y la pagina no scrolleaba. En escritorio no se
     notaba porque los 30 nombres entraban en una pantalla. */
  html,body{background:var(--bg);color:var(--paper);font-family:var(--disp);overflow-x:hidden;
    min-height:100%}
  a{color:inherit;text-decoration:none}

  .lfb-top{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;justify-content:space-between;
    align-items:center;padding:24px var(--gmargin);font-size:12px;letter-spacing:.06em;
    mix-blend-mode:difference}
  /* back = mismo ojito+flecha del header de index.html (nunca el texto "back digitalpaula"
     — pedido explicito de Paula: "quitar el texto y hacerlo como el resto"). Como esta
     pagina no tiene hero que tapar, el ojo esta SIEMPRE visible (sin el toggle .on de
     index.html), solo la flechita aparece al hover, igual que alli. */
  .lfb-back{display:flex;align-items:center;opacity:.85;transition:opacity .2s ease}
  .lfb-back:hover{opacity:1}
  .lfb-back-arrow{display:block;width:0;opacity:0;overflow:hidden;flex-shrink:0;
    transition:width .3s ease,opacity .3s ease,margin-right .3s ease;margin-right:0}
  .lfb-back:hover .lfb-back-arrow{width:16px;opacity:1;margin-right:10px}
  .lfb-back-arrow i{position:relative;width:16px;height:8px;display:block}
  .lfb-back-arrow i::before{content:'';position:absolute;left:0;top:50%;width:16px;height:1px;
    background:currentColor}
  .lfb-back-arrow i::after{content:'';position:absolute;left:0;top:50%;width:6px;height:6px;
    border-left:1px solid currentColor;border-bottom:1px solid currentColor;
    transform:translateY(-50%) rotate(45deg)}
  .lfb-eye{height:28px;width:auto;object-fit:contain;pointer-events:none;flex-shrink:0;display:block}

  /* ---------- GRILLA DE LOGOS (ref benorth.studio/es/servicios, bloque "Clientes") ----------
     4 columnas, todos los logos apagados (blanco al 30% = gris sobre el negro) y el que se
     apunta se prende a blanco pleno. Los PNG de work/logofolio/grilla/ ya vienen RECORTADOS
     al borde de la marca (sin aire transparente), asi que el tamano que se ve es el de la
     marca real. --w/--h de cada logo salen de un calculo de peso optico: misma superficie
     para todos, corregida por cuanta tinta tiene cada uno (un logo de trazo fino ocupa algo
     mas de caja que uno macizo), con tope de 170x62. Asi un isotipo cuadrado y un logotipo
     largo se leen del mismo tamano, que es lo que hace la referencia ajustando a mano. */
  .lfg{min-height:100vh;min-height:100svh;padding:130px var(--gmargin) 120px;position:relative;z-index:2}
  .lfg-head{display:flex;justify-content:space-between;align-items:baseline;
    font-family:var(--disp);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:#8a8a8a;margin-bottom:clamp(40px,6vw,88px)}
  .lfg-grid{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);gap:14px 18px;--s:1}
  .lfg-cell{height:clamp(104px,9vw,140px);display:flex;align-items:center;justify-content:center}
  .lfg-cell img{display:block;width:calc(var(--w) * var(--s));height:calc(var(--h) * var(--s));
    object-fit:contain;opacity:.3;transition:opacity .3s ease}
  .lfg-cell:hover img{opacity:1}
  /* la celda "tu logo aca" de la referencia: lleva al contacto */
  .lfg-cta a{font-family:var(--disp);font-size:15px;color:#d4d4d4;
    text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px;transition:color .3s ease}
  .lfg-cta a:hover{color:var(--paper)}
  @media(max-width:1100px){ .lfg-grid{--s:.85} }
  @media(max-width:900px){ .lfg-grid{grid-template-columns:repeat(3,1fr)} }
  @media(max-width:640px){
    .lfg{padding-top:100px}
    .lfg-grid{grid-template-columns:repeat(2,1fr);gap:6px 12px;--s:.72}
    .lfg-cell{height:88px}
    .lfg-cta a{font-size:13px}
  }

  /* FOTO AL HOVER: al apuntar un logo aparece una foto del cliente que acompania al mouse
     (con un poco de retraso, para que se sienta suelta y no pegada al cursor). Alterna
     entre las dos fotos de cada cliente (data-a / data-b) mientras dure el hover. Si el
     cursor esta en la mitad derecha de la pantalla la foto se abre hacia la izquierda, asi
     nunca se sale. Respeta la proporcion de cada foto: el ancho es fijo y el alto lo da la
     imagen. En tactil no existe (no hay hover). */
  .lfg-prev{position:fixed;top:0;left:0;z-index:5;width:clamp(200px,18vw,300px);
    pointer-events:none;opacity:0;transform:translate3d(-999px,-999px,0);
    transition:opacity .25s ease}
  .lfg-prev.on{opacity:1}
  .lfg-prev-in{position:relative;transform:scale(.92);transition:transform .45s cubic-bezier(.22,.61,.36,1)}
  .lfg-prev.on .lfg-prev-in{transform:scale(1)}
  /* la caja toma la proporcion de la foto que se esta viendo (--ar, la pone el JS), asi
     ninguna de las dos se recorta */
  .lfg-prev-in{aspect-ratio:var(--ar,4/5);transition:transform .45s cubic-bezier(.22,.61,.36,1),aspect-ratio .35s ease}
  .lfg-prev img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s ease}
  .lfg-prev img.on{opacity:1}
  @media(hover:none){ .lfg-prev{display:none} }

  /* ---------- GALERIA AL CLICK (solo clientes con mas de 2 fotos) ----------
     El fondo se desenfoca y las fotos del cliente pasan en una fila horizontal, todas al
     mismo ALTO y cada una con su ancho natural (nada se recorta). Se recorre con la rueda
     del mouse (la rueda vertical mueve la fila), arrastrando, con las flechas del teclado
     o con el dedo. Cierra con la X, con Esc o clickeando el fondo.
     Las fotos salen de la seleccion curada de cada proyecto del Selected Work (PROJECTS en
     index.html), no de la carpeta entera: ahi ya estaban sacadas las repetidas y las que
     no se leen. */
  .lfg-cell.tiene-gal{cursor:pointer}
  .lfg-prev-n{position:absolute;left:0;bottom:-22px;font-family:var(--disp);font-size:11px;
    letter-spacing:.12em;text-transform:uppercase;color:#d4d4d4;white-space:nowrap}
  .lfg-prev-n:empty{display:none}
  .lfg-gal{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:center;
    background:rgba(0,0,0,.5);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);
    opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s linear .45s}
  .lfg-gal.open{opacity:1;visibility:visible;transition:opacity .45s ease}
  .lfg-gal-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:16px;
    padding:22px var(--gmargin)}
  .lfg-gal-logo{height:40px;width:auto;max-width:120px;object-fit:contain}
  .lfg-gal-name{font-family:"HelveticaNeueHeavy",var(--disp);font-weight:800;font-size:20px;
    text-transform:uppercase;letter-spacing:-.02em}
  .lfg-gal-tag{font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.7}
  .lfg-gal-tag::before{content:"/ "}
  .lfg-gal-n{margin-left:auto;font-size:12px;letter-spacing:.12em;opacity:.8;font-variant-numeric:tabular-nums}
  .lfg-gal-x{background:none;border:1px solid rgba(255,255,255,.35);color:var(--paper);
    width:34px;height:34px;font-size:14px;cursor:pointer;transition:.2s}
  .lfg-gal-x:hover{background:var(--paper);color:var(--ink)}
  .lfg-gal-track{display:flex;align-items:center;gap:14px;height:64vh;overflow-x:auto;overflow-y:hidden;
    padding:0 var(--gmargin);scrollbar-width:none;cursor:grab;user-select:none;-webkit-user-select:none}
  .lfg-gal-track::-webkit-scrollbar{display:none}
  .lfg-gal-track.arrastrando{cursor:grabbing}
  .lfg-gal-track > *{height:100%;width:auto;flex:0 0 auto;display:block;background:#111;
    -webkit-user-drag:none;
    opacity:0;transform:translateX(70px);transition:opacity .6s ease,transform .8s cubic-bezier(.16,1,.3,1)}
  .lfg-gal.open .lfg-gal-track > *{opacity:1;transform:none}
  .lfg-gal-hint{position:absolute;bottom:22px;left:var(--gmargin);font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;opacity:.55}
  html.gal-abierta{overflow:hidden}
  @media(max-width:640px){
    .lfg-gal-track{height:52vh;gap:8px}
    .lfg-gal-name{font-size:16px}
    .lfg-gal-logo{height:30px}
    .lfg-gal-tag{display:none}
  }
  /* en tactil no hay hover: los logos van a blanco pleno de entrada */
  @media(hover:none){ .lfg-cell img{opacity:.85} }

  /* cursor a medida (mismo sistema que index.html, ref tol.is): crosshair fino que
     se convierte en corners+diamante sobre una fila. sin esto el cursor nativo
     desaparecia (cursor:none global) y no quedaba nada mostrando donde estaba el mouse. */
  /* El cursor a medida vive entero dentro de @media(hover:hover) and (pointer:fine).
     En un telefono esa consulta NO aplica, asi que el <div> se quedaba sin position:fixed
     y quedaba como un bloque normal al principio del <body>: 19px muertos arriba de toda
     la pagina. Eso corria el hero hacia abajo y empujaba su bloque de texto -anclado al
     borde inferior- fuera de la pantalla, cortando el [ let's talk ].
     Se apaga por defecto y el propio media query lo enciende. */
  .xcursor{display:none}
  @media(hover:hover) and (pointer:fine){
    *{cursor:none}
    /* mix-blend-mode:difference = SIEMPRE contrasta con lo que tenga debajo (blanco
       sobre fondo oscuro, negro sobre fondo claro) — Paula dijo que no se veia,
       asi que ademas lo agrande y le subi la opacidad a full. */
    .xcursor{display:block;position:fixed;top:0;left:0;z-index:9999;pointer-events:none;
      transform:translate3d(-100px,-100px,0);opacity:0;transition:opacity .2s ease;
      mix-blend-mode:difference}
    .xcursor.on{opacity:1}
    .xc-inner{position:relative}
    .xc-tick{position:absolute;background:#fff;transition:opacity .15s ease}
    .xc-t{left:-1px;top:-26px;width:2px;height:19px}
    .xc-b{left:-1px;top:7px;width:2px;height:19px}
    .xc-l{left:-26px;top:-1px;width:19px;height:2px}
    .xc-r{left:7px;top:-1px;width:19px;height:2px}
    .xc-dot{position:absolute;left:-2.5px;top:-2.5px;width:5px;height:5px;border-radius:50%;
      background:#fff;transition:opacity .15s ease}
    .xc-hover{position:absolute;left:-14px;top:-14px;width:28px;height:28px;
      opacity:0;transition:opacity .15s ease}
    .xcursor.hover .xc-hover{opacity:1}
    .xcursor.hover .xc-tick,.xcursor.hover .xc-dot{opacity:0}
    .xc-corner{position:absolute;width:7px;height:7px;
      border-top:1.5px solid #fff;border-left:1.5px solid #fff}
    .xc-c1{top:0;left:0}
    .xc-c2{top:0;right:0;transform:rotate(90deg)}
    .xc-c3{bottom:0;right:0;transform:rotate(180deg)}
    .xc-c4{bottom:0;left:0;transform:rotate(270deg)}
    .xc-diamond{position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;
      border:1px solid #fff;transform:rotate(45deg)}
  }
  /* ---------- menu lateral (portado 1:1 desde index.html) ----------
     Antes aca solo decia "Logofolio" como texto muerto. Ahora es el mismo waffle 3x3 y
     el mismo panel que el resto del sitio, para que el menu este disponible tambien en
     esta pagina. Los links a secciones apuntan a index.html#seccion porque esas
     secciones NO existen aca (un "#work" pelado no iria a ningun lado). */
  .menu-btn{background:none;border:none;color:var(--paper);
    padding:8px;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center}
  .menu-btn:hover{opacity:.6}
  .waffle{display:grid;grid-template-columns:repeat(3,3px);grid-template-rows:repeat(3,3px);gap:3px}
  .waffle i{width:3px;height:3px;background:currentColor;display:block}

  .menu-overlay{position:fixed;inset:0;z-index:40;background:rgba(5,5,5,.08);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    opacity:0;pointer-events:none;visibility:hidden;
    transition:opacity .4s ease,visibility 0s linear .4s}
  .menu-overlay.open{opacity:1;pointer-events:auto;visibility:visible;transition:opacity .4s ease}
  .menu-panel{position:fixed;top:0;right:0;bottom:0;z-index:41;
    width:clamp(300px,29vw,560px);background:rgba(10,10,10,.4);
    backdrop-filter:blur(50px);-webkit-backdrop-filter:blur(50px);
    border-left:1px solid rgba(255,255,255,.12);
    transform:translateX(100%);visibility:hidden;
    transition:transform .45s cubic-bezier(.19,1,.22,1),visibility 0s linear .45s;
    padding:24px 26px 34px;overflow-y:auto}
  .menu-panel.open{transform:translateX(0);visibility:visible;
    transition:transform .45s cubic-bezier(.19,1,.22,1)}
  .menu-top{display:flex;justify-content:space-between;align-items:center;
    font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.1em;
    text-transform:uppercase;margin-bottom:clamp(22px,4.5vh,52px)}
  .menu-close{background:none;border:1px solid rgba(255,255,255,.3);color:var(--paper);
    width:28px;height:28px;cursor:pointer;font-size:13px;transition:.2s}
  .menu-close:hover{background:var(--paper);color:var(--ink)}
  .menu-items{display:flex;flex-direction:column}
  .menu-item{position:relative;display:flex;align-items:baseline;gap:14px;
    text-decoration:none;color:var(--paper);font-family:var(--disp);font-weight:800;
    text-transform:uppercase;letter-spacing:-.1em;
    font-size:clamp(30px,3.95vw,76px);line-height:1;
    padding:clamp(14px,2.6vh,26px) 0;border-bottom:1px solid rgba(255,255,255,.28);
    transition:opacity .2s,padding-left .3s}
  .menu-item:hover{opacity:.6;padding-left:10px}
  /* la pagina actual queda marcada y sin hover: no tiene sentido "ir" a donde ya estas */
  .menu-item[aria-current="page"]{opacity:.4;pointer-events:none}
  .mi-sub{font-family:var(--body);font-weight:400;letter-spacing:0;text-transform:uppercase;
    font-size:clamp(11px,1vw,19px);opacity:.6;white-space:nowrap}
  .menu-contact{margin-top:clamp(16px,3vh,32px);padding-top:14px;
    border-top:1px solid rgba(255,255,255,.16);display:flex;flex-direction:column;gap:4px}
  .menu-contact-label{font-family:var(--disp);font-weight:300;font-size:10px;letter-spacing:.2em;
    text-transform:uppercase;opacity:.55}
  .menu-contact-mail{font-family:var(--disp);font-weight:500;font-size:clamp(12px,1vw,16px);
    letter-spacing:-.01em;color:var(--paper);text-decoration:none;opacity:.9;transition:.2s}
  .menu-contact-mail:hover{opacity:1;background-image:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
  .menu-contact-ww{font-family:var(--disp);font-weight:300;font-size:9px;letter-spacing:.2em;
    text-transform:uppercase;opacity:.5}
  .menu-avail{display:inline-block;width:7px;height:7px;border-radius:50%;
    background:#3ddc84;margin-left:9px;vertical-align:middle;opacity:1;
    animation:availPulse 2.4s ease-out infinite}
  @keyframes availPulse{
    0%{box-shadow:0 0 0 0 rgba(61,220,132,.5)}
    70%{box-shadow:0 0 0 7px rgba(61,220,132,0)}
    100%{box-shadow:0 0 0 0 rgba(61,220,132,0)}
  }
  @media(prefers-reduced-motion:reduce){ .menu-avail{animation:none} }
  /* helvetica bold + tracking -60 (-60/1000 = -.06em), igual que en index.html */
  .menu-talk{display:block;margin-top:clamp(10px,1.6vh,18px);text-decoration:none;color:var(--paper);
    font-family:var(--disp);font-weight:700;font-size:clamp(10px,.85vw,15px);letter-spacing:-.06em;
    text-transform:uppercase;opacity:.75;transition:.2s}
  .menu-talk:hover{opacity:1}
  /* PORTADO DE index.html. Faltaba entero: el menu de esta pagina se copio 1:1 de index
     ANTES de que se agrandara para telefono, asi que se quedo con los cuerpos de escritorio.
     Los seis estan en clamp() con el medio en vw y calibrados para pantalla ancha: en 375px
     todos caen a su piso (item 30px, sub 11, label 10, mail 12, ww 9, talk 10) y el panel
     ademas se quedaba en 300px sin llegar al borde. Fijos en px, que es lo correcto cuando
     el ancho ya no varia lo suficiente como para que escalar aporte algo.
     width:100% y no 100vw: 100vw incluye el ancho del scrollbar y en un panel fixed;right:0
     eso lo corre ~15px fuera del borde izquierdo. */
  /* Los seis cuerpos del menu estan en clamp() con el medio en vw, calibrados para
     pantalla ancha: por debajo de 900px todos caen a su piso (item 30px, sub 11...) y el
     panel se lee chico. Se fijan en px, que es lo correcto cuando el ancho ya no varia lo
     suficiente como para que escalar aporte algo.
     El corte va en 900 y no en 640: el iPad (768-834) quedaba afuera y por eso se veia
     con los cuerpos de escritorio. */
  @media(max-width:900px){
    /* en tablet el panel sigue siendo lateral pero mas ancho, porque con 300px los items
       de 48px no entraban. En telefono (abajo) pasa a ocupar todo. */
    .menu-panel{width:min(440px,72vw);display:flex;flex-direction:column}
    /* Los ITEMS arrancan arriba, pegados al titulo: con margin-top:auto quedaban empujados
       al fondo y en pantallas altas se leian "muy abajo". El que queda anclado al borde
       inferior es el bloque de CONTACTO, que es lo que se buscaba con "abajo a la
       izquierda". overflow-y:auto es la red por si en una pantalla muy baja no entra:
       ahi el margen automatico se anula y scrollea, en vez de recortarse. */
    .menu-items{margin-top:clamp(16px,4vh,44px)}
    .menu-contact{margin-top:auto}
    .menu-top{font-size:14px}
    .menu-close{width:34px;height:34px;font-size:16px}
    .menu-item{font-size:48px}
    .mi-sub{font-size:17px}
    .menu-contact-label{font-size:16px}
    .menu-contact-mail{font-size:18px}
    .menu-contact-ww{font-size:14px}
    .menu-talk{font-size:16px}
  }
  @media(max-width:640px){
    .menu-panel{width:100%}
  }
  /* (j) El video del ojito del header TIENE canal alfa (VP9 con alpha_mode), pero Safari
     no soporta transparencia en WebM y lo dibuja con su fondo negro: por eso en iPhone se
     ve un rectangulo. El fondo del video es negro puro (0,0,0) y el del sitio es #050505,
     asi que la diferencia se nota.
     mix-blend-mode:screen resuelve sin archivo nuevo: en modo screen el negro puro es
     neutro -deja pasar el fondo tal cual- y solo queda el ojo. Funciona en todos los
     navegadores, Safari incluido, y evita tener que mantener un segundo video en HEVC con
     alfa solo para Apple. isolation:isolate en el contenedor lo mantiene blendeando contra
     la pagina y no contra si mismo. */

/* cursor a medida (mismo sistema de index.html, ref tol.is): el cursor nativo esta
   apagado (cursor:none) asi que este SIEMPRE tiene que estar visible y por delante
   de todo (z-index:9999) — nunca se esconde al pasar sobre un nombre, solo cambia
   a el estado "hover" (corners+diamante). */
(function(){
  const cursor = document.getElementById('xcursor');
  if(!cursor || !window.matchMedia('(hover:hover) and (pointer:fine)').matches) return;
  document.addEventListener('mousemove', e=>{
    cursor.style.transform = `translate3d(${e.clientX}px,${e.clientY}px,0)`;
    cursor.classList.add('on');
    cursor.classList.toggle('hover', !!e.target.closest('[data-hover]'));
  });
  document.addEventListener('mouseleave', ()=> cursor.classList.remove('on'));
})();

/* foto que acompania al mouse sobre cada logo (ver .lfg-prev en el CSS) */
(function(){
  const prev = document.getElementById('lfgPrev');
  if(!prev || !matchMedia('(hover:hover)').matches) return;
  const A = prev.querySelector('.a'), B = prev.querySelector('.b');
  let mx = 0, my = 0, x = 0, y = 0, activa = null, giro = 0, corriendo = false;
  // precarga: la primera vez que se apunta un logo la foto ya esta lista
  document.querySelectorAll('.lfg-cell[data-a]').forEach(c => { new Image().src = c.dataset.a; new Image().src = c.dataset.b; });
  const inner = prev.querySelector('.lfg-prev-in');
  function mostrar(ver, ocultar){
    ocultar.classList.remove('on'); ver.classList.add('on');
    const ar = () => { if(ver.naturalWidth) inner.style.setProperty('--ar', ver.naturalWidth + ' / ' + ver.naturalHeight); };
    if(ver.complete) ar(); else ver.onload = ar;
  }
  function loop(){
    x += (mx - x) * .16; y += (my - y) * .16;
    const w = prev.offsetWidth, h = prev.offsetHeight;
    const izq = mx > innerWidth / 2;
    let px = izq ? x - w - 28 : x + 28;
    let py = Math.max(12, Math.min(innerHeight - h - 12, y - h / 2));
    prev.style.transform = `translate3d(${px}px,${py}px,0)`;
    if(activa || Math.abs(mx - x) > .5) requestAnimationFrame(loop); else corriendo = false;
  }
  addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY;
    if(!corriendo){ corriendo = true; requestAnimationFrame(loop); } });
  document.querySelectorAll('.lfg-cell[data-a]').forEach(c => {
    c.addEventListener('mouseenter', e => {
      if(!activa){ x = mx = e.clientX; y = my = e.clientY; }   // aparece donde esta el mouse, sin viajar
      activa = c; A.src = c.dataset.a; B.src = c.dataset.b;
      mostrar(A, B);
      clearInterval(giro); giro = setInterval(() => B.classList.contains('on') ? mostrar(A, B) : mostrar(B, A), 1300);
      prev.classList.add('on');
      if(!corriendo){ corriendo = true; requestAnimationFrame(loop); }
    });
    c.addEventListener('mouseleave', () => {
      if(activa !== c) return;
      activa = null; clearInterval(giro); prev.classList.remove('on');
    });
  });
})();

(function(){
  const gal = document.getElementById('lfgGal'), track = document.getElementById('lfgTrack');
  const nEl = gal.querySelector('.lfg-gal-n'), prev = document.getElementById('lfgPrev');
  let objetivo = 0, anim = 0, movido = false;
  const dos = n => String(n).padStart(2,'0');

  // la foto del hover avisa cuantas hay, para que se sepa que hay galeria
  if(matchMedia('(hover:hover)').matches) document.querySelectorAll('.lfg-cell[data-a]').forEach(c => c.addEventListener('mouseenter', () => {
    prev.querySelector('.lfg-prev-n').textContent = c.dataset.n ? c.dataset.n + ' photos — click' : '';
  }));

  function contador(){
    const items = [...track.children]; if(!items.length) return;
    const ref = track.getBoundingClientRect().left + innerWidth * .3;
    let k = 0; items.forEach((it,i) => { if(it.getBoundingClientRect().left <= ref) k = i; });
    if(track.scrollLeft + track.clientWidth >= track.scrollWidth - 4) k = items.length - 1;
    nEl.textContent = dos(k + 1) + ' / ' + dos(items.length);
  }
  function abrir(slug){
    const g = typeof slug === 'string' ? GAL[slug] : slug; if(!g) return;
    gal.querySelector('.lfg-gal-logo').src = g.logo;
    gal.querySelector('.lfg-gal-name').textContent = g.name;
    gal.querySelector('.lfg-gal-tag').textContent = g.tag;
    track.innerHTML = '';
    g.items.forEach((src, i) => {
      let el;
      if(src.endsWith('.mp4')){
        el = document.createElement('video'); el.muted = true; el.loop = true; el.playsInline = true;
        el.autoplay = true; el.setAttribute('muted', ''); el.src = src;
      } else {
        el = document.createElement('img'); el.alt = g.name; el.decoding = 'async'; el.draggable = false;
        if(i > 3) el.loading = 'lazy';
        el.src = src;
      }
      el.style.transitionDelay = Math.min(i, 6) * 0.07 + 's';   // entran en cascada desde la derecha
      track.appendChild(el);
    });
    track.scrollLeft = 0; objetivo = 0;
    prev.classList.remove('on');
    document.documentElement.classList.add('gal-abierta');
    gal.setAttribute('aria-hidden', 'false');
    void gal.offsetWidth;            // fuerza el estado inicial para que la entrada se anime
    gal.classList.add('open');
    contador();
  }
  function cerrar(){
    gal.classList.remove('open'); gal.setAttribute('aria-hidden', 'true');
    document.documentElement.classList.remove('gal-abierta');
    track.querySelectorAll('video').forEach(v => v.pause());
    setTimeout(() => { if(!gal.classList.contains('open')) track.innerHTML = ''; }, 500);
  }
  function abrirCelda(c){
    if(c.classList.contains('tiene-gal')) return abrir(c.dataset.slug);
    const im = c.querySelector('img');
    abrir({ name: c.getAttribute('aria-label') || '', tag: '', logo: im ? im.getAttribute('src') : '',
      items: [c.dataset.a, c.dataset.b].filter(Boolean) });
  }
  document.querySelectorAll('.lfg-cell.tiene-gal').forEach(c => c.addEventListener('click', () => abrir(c.dataset.slug)));
  // telefono/tablet: no hay hover, asi que la foto que acompana al mouse nunca se ve. Ahi
  // tocar CUALQUIER logo abre sus fotos en la galeria (los que no tienen galeria propia
  // muestran sus 2 fotos del hover).
  // (antes solo con hover:none; hay telefonos Android que se anuncian con hover, y ahi no
  // pasaba nada al tocar. Ahora vale para todos: en compu el click tambien abre las fotos)
  {
    document.querySelectorAll('.lfg-cell[data-a]:not(.tiene-gal)').forEach(c => {
      c.style.cursor = 'pointer';
      c.addEventListener('click', () => abrir({ name: c.getAttribute('aria-label') || '', tag: '',
        logo: (c.querySelector('img') || {}).getAttribute ? c.querySelector('img').getAttribute('src') : '',
        items: [c.dataset.a, c.dataset.b].filter(Boolean) }));
    });
  }
  // TOQUE (2026-10-05): en iPhone el click a veces no llega (Safari se lo come como "hover"
  // del primer toque). Se abre directo en el pointerup del dedo si no fue un scroll, y se
  // ignora el click que llega despues para no abrir dos veces.
  let t0 = null, ultimoToque = 0;
  document.querySelectorAll('.lfg-cell[data-a]').forEach(c => {
    c.addEventListener('pointerdown', e => { if(e.pointerType !== 'mouse') t0 = {x: e.clientX, y: e.clientY, t: Date.now()}; });
    c.addEventListener('pointerup', e => {
      if(e.pointerType === 'mouse' || !t0) return;
      const quieto = Math.hypot(e.clientX - t0.x, e.clientY - t0.y) < 10 && Date.now() - t0.t < 600; t0 = null;
      if(!quieto || gal.classList.contains('open')) return;
      ultimoToque = Date.now(); abrirCelda(c);
    });
    c.addEventListener('pointercancel', () => { t0 = null; });
    c.addEventListener('click', e => { if(Date.now() - ultimoToque < 800) e.stopImmediatePropagation(); }, true);
  });
  gal.querySelector('.lfg-gal-x').addEventListener('click', cerrar);
  gal.addEventListener('click', e => {
    if(movido || Date.now() - ultimoToque < 800) return;   // el click fantasma del toque que la abrio
    if(e.target === gal || e.target === track) cerrar();
  });

  // rueda / flechas: la fila se desliza suave hacia el objetivo (no a saltos)
  function ir(x){
    objetivo = Math.max(0, Math.min(track.scrollWidth - track.clientWidth, x));
    if(!anim) anim = requestAnimationFrame(paso);
  }
  function paso(){
    const d = objetivo - track.scrollLeft;
    if(Math.abs(d) < .5){ track.scrollLeft = objetivo; anim = 0; contador(); return; }
    track.scrollLeft += d * .14; contador();
    anim = requestAnimationFrame(paso);
  }
  addEventListener('keydown', e => {
    if(!gal.classList.contains('open')) return;
    if(e.key === 'Escape') cerrar();
    if(e.key === 'ArrowRight' || e.key === 'ArrowLeft'){
      const items = [...track.children];
      const x0 = track.getBoundingClientRect().left + parseFloat(getComputedStyle(track).paddingLeft);
      const sig = e.key === 'ArrowRight'
        ? items.find(it => it.getBoundingClientRect().left > x0 + 4)
        : items.slice().reverse().find(it => it.getBoundingClientRect().left < x0 - 4);
      if(sig) ir(track.scrollLeft + sig.getBoundingClientRect().left - x0);
    }
  });
  track.addEventListener('wheel', e => {
    e.preventDefault();
    const delta = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
    ir((anim ? objetivo : track.scrollLeft) + delta * 1.2);
  }, {passive:false});
  gal.addEventListener('wheel', e => { if(e.target === gal) e.preventDefault(); }, {passive:false});
  track.addEventListener('scroll', () => { if(!anim) contador(); }, {passive:true});

  // arrastre con el mouse (en tactil el scroll nativo ya lo resuelve)
  let px0 = 0, s0 = 0, abajo = false;
  track.addEventListener('pointerdown', e => {
    if(e.pointerType !== 'mouse') return;
    abajo = true; movido = false; px0 = e.clientX; s0 = track.scrollLeft;
    cancelAnimationFrame(anim); anim = 0;
  });
  addEventListener('pointermove', e => {
    if(!abajo) return;
    const dx = e.clientX - px0;
    if(Math.abs(dx) > 4){ movido = true; track.classList.add('arrastrando'); }
    track.scrollLeft = s0 - dx; objetivo = track.scrollLeft;
  });
  addEventListener('pointerup', () => {
    if(!abajo) return;
    abajo = false; track.classList.remove('arrastrando');
    setTimeout(() => { movido = false; }, 0);
  });
})();

/* ---------- navegar la grilla con el mouse (ver "NAVEGAR LA GRILLA" en el CSS) ---------- */
(function(){
  if(!matchMedia('(hover:hover) and (pointer:fine)').matches || innerWidth <= 900) return;
  document.documentElement.classList.add('lfg-mundo');
  const grid = document.querySelector('.lfg-grid'); if(!grid) return;
  /* los MEJORES al centro del mundo (pedido de Paula): se ordenan las 40 casillas (8x5) por
     distancia al centro; los principales ocupan las mas cercanas, el resto sigue alrededor en
     su orden alfabetico y las casillas mas lejanas (rincones) quedan vacias. Solo en este
     modo: en telefono la grilla sigue alfabetica. */
  const MEJORES = ['boota-isotipo','klik','universe','492','camalote-seeds','malika','r-o-podcast','candela-mazzei'];
  const COLS = 8, FILAS = 5;
  const clave = c => { const i = c.querySelector('img'); return i ? i.getAttribute('src').split('/').pop().replace('.png','') : 'cta'; };
  const todas = [...grid.children];
  const top = MEJORES.map(k => todas.find(c => clave(c) === k)).filter(Boolean);
  const resto = todas.filter(c => !top.includes(c));
  const casillas = [];
  for(let f = 0; f < FILAS; f++) for(let k = 0; k < COLS; k++) casillas.push({f, k, d: Math.hypot((f - (FILAS - 1) / 2) * 1.25, k - (COLS - 1) / 2)});
  const porCercania = casillas.slice().sort((a, b) => a.d - b.d);
  const orden = [...top, ...resto];
  porCercania.forEach((c, i) => { c.el = orden[i] || null; });
  grid.innerHTML = '';
  /* SIN HUECOS (2026-10-06, Paula: "que no queden espacios vacios, que se vaya rellenando
     la grilla"): las casillas que sobran se llenan repitiendo logos (los que no estan entre
     los MEJORES, en orden), lejos del centro. La copia no tiene listeners propios: le pasa
     el hover y el click a la original, asi abre la misma foto y la misma galeria. */
  const repetibles = resto.filter(c => c.querySelector('img') && c.dataset.a);
  let r = 0;
  casillas.forEach(c => {
    if(c.el){ grid.appendChild(c.el); return; }
    const orig = repetibles[r++ % repetibles.length];
    if(!orig){ const v = document.createElement('li'); v.className = 'lfg-cell lfg-vacia'; v.setAttribute('aria-hidden', 'true'); grid.appendChild(v); return; }
    const cp = orig.cloneNode(true); cp.classList.add('lfg-copia'); cp.setAttribute('aria-hidden', 'true'); cp.removeAttribute('role');
    const pasar = tipo => e => orig.dispatchEvent(new MouseEvent(tipo, {clientX: e.clientX, clientY: e.clientY}));
    cp.addEventListener('mouseenter', pasar('mouseenter'));
    cp.addEventListener('mouseleave', pasar('mouseleave'));
    cp.addEventListener('click', () => orig.click());
    grid.appendChild(cp);
  });
  const cells = [...grid.children];
  let tx = .5, ty = .5, x = .5, y = .5, dentro = false, mx = -1e4, my = -1e4, t0 = performance.now();
  addEventListener('mousemove', e => {
    // un pequeno margen en los bordes: no hace falta llevar el mouse al limite para ver la ultima fila
    const k = v => Math.min(1, Math.max(0, (v - .08) / .84));
    tx = k(e.clientX / innerWidth); ty = k(e.clientY / innerHeight);
    mx = e.clientX; my = e.clientY; dentro = true;
  });
  document.addEventListener('mouseleave', () => { dentro = false; mx = my = -1e4; });
  function cuadro(now){
    if(document.documentElement.classList.contains('gal-abierta')) return;   // galeria abierta: quieto
    if(!dentro){ const s = (now - t0) / 1000; tx = .5 + Math.sin(s * .09) * .45; ty = .5 + Math.cos(s * .12) * .4; }
    x += (tx - x) * (dentro ? .045 : .012); y += (ty - y) * (dentro ? .045 : .012);
    const sx = grid.offsetWidth - innerWidth, sy = grid.offsetHeight - innerHeight;
    grid.style.transform = `translate3d(${-x * Math.max(0, sx)}px,${-y * Math.max(0, sy)}px,0)`;
    const R = innerWidth * .22;
    for(const c of cells){
      const img = c.querySelector('img'); if(!img) continue;
      if(dentro){
        const b = c.getBoundingClientRect(), d = Math.hypot(b.left + b.width / 2 - mx, b.top + b.height / 2 - my);
        const f = Math.max(0, 1 - d / R);
        img.style.setProperty('--o', (.28 + f * .72).toFixed(3)); img.style.setProperty('--z', (1 + f * .06).toFixed(3));
      } else { img.style.setProperty('--o', .28); img.style.setProperty('--z', 1); }
    }
  }
  (function loop(now){ cuadro(now); requestAnimationFrame(loop); })(performance.now());
  setTimeout(() => cuadro(performance.now()), 50);
})();
/* SIN HUECOS fuera del modo mundo (telefono/tablet): la ultima fila de la grilla se completa
   repitiendo logos, segun cuantas columnas haya en ese ancho. Tocar la copia abre lo mismo
   que la original. */
(function(){
  if(document.documentElement.classList.contains('lfg-mundo')) return;
  const grid = document.querySelector('.lfg-grid'); if(!grid) return;
  const originales = [...grid.children].filter(c => c.querySelector('img') && c.dataset.a);
  function rellenar(){
    grid.querySelectorAll('.lfg-relleno').forEach(c => c.remove());
    const cols = getComputedStyle(grid).gridTemplateColumns.split(' ').length;
    const faltan = (cols - grid.children.length % cols) % cols;
    for(let i = 0; i < faltan; i++){
      const orig = originales[(originales.length - 1 - i * 3 + originales.length * 9) % originales.length];
      const cp = orig.cloneNode(true); cp.classList.add('lfg-relleno'); cp.setAttribute('aria-hidden', 'true'); cp.removeAttribute('role');
      cp.addEventListener('click', () => orig.click());
      grid.appendChild(cp);
    }
  }
  rellenar();
  let t; addEventListener('resize', () => { clearTimeout(t); t = setTimeout(rellenar, 150); });
})();
</script>
